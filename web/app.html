<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // https://hybercrm.com is the only address: the Hosting site's own domains forward to it.
      if (location.hostname === 'hybercrm.web.app' || location.hostname === 'hybercrm.firebaseapp.com')
        location.replace('https://hybercrm.com' + location.pathname + location.search + location.hash);
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Hyber" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#171717" />
    <meta name="robots" content="noindex" />
    <!-- meta -->
    <meta name="description" content="Hyber CRM — scheduling, time clock, payroll and session logs for tutoring centers." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hyber CRM" />
    <meta property="og:title" content="Hyber CRM" />
    <meta property="og:description" content="Scheduling, time clock, payroll and session logs for tutoring centers. Software by HyberTec LLC." />
    <meta property="og:url" content="https://hybercrm.com/" />
    <meta property="og:image" content="https://hybercrm.com/icons/icon-512.png?v=2" />
    <meta name="twitter:card" content="summary" />
    <!-- /meta -->
    <title>Hyber CRM</title>
    <script>
      // On a branch page, show that branch's icon and name right away (the app saves them on this device).
      try {
        var tab = JSON.parse(localStorage.getItem('hyber:tab:' + location.pathname.split('/')[1]) || 'null');
        if (tab) {
          var icon = document.querySelector('link[rel="icon"]');
          icon.type = 'image/png';
          icon.href = tab.icon;
          document.querySelector('link[rel="apple-touch-icon"]').href = tab.touch;
          document.querySelector('meta[name="apple-mobile-web-app-title"]').content = tab.title;
          document.title = tab.name;
        }
      } catch (e) {}
    </script>
    <script>
      try {
        var t = localStorage.getItem('hyber:theme');
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
