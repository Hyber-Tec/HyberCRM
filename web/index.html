<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // https://hybercrm.com is the only address: the Hosting site's own domains forward to it.
      if (location.hostname === 'hybercrm.web.app' || location.hostname === 'hybercrm.firebaseapp.com')
        location.replace('https://hybercrm.com' + location.pathname + location.search + location.hash);
      // Scroll animations hide content only when scripts run.
      document.documentElement.classList.add('js');
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050507" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2" />
    <link rel="preload" as="image" href="/landing/demo-home.webp" fetchpriority="high" />
    <!-- head -->
    <title>Hyber CRM</title>
    <!-- /head -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/landing/main.tsx"></script>
  </body>
</html>
